<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Хамелеоны</title>
  <link rel="icon" type="image/png" href="assets/icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&family=Comfortaa:wght@300..700&display=swap"
    rel="stylesheet">
  <style>
    :root {
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
      --bg: #f6f5f0;
      --card: #fff;
      --text: #222;
      --muted: #666;
      --line: #ddd;
      --accent: #2f6fed;
      --accent-text: #fff;
      --ok: #1f7a3a;
      color-scheme: light;
    }

    @media (prefers-color-scheme:dark) {
      :root:not([data-theme="light"]) {
        --bg: #1b1c1e;
        --card: #26282b;
        --text: #eee;
        --muted: #a0a4a8;
        --line: #3a3d41;
        --accent: #5b8cff;
        --accent-text: #0b1020;
        --ok: #5fd18a;
        color-scheme: dark
      }
    }

    :root[data-theme="dark"] {
      --bg: #1b1c1e;
      --card: #26282b;
      --text: #eee;
      --muted: #a0a4a8;
      --line: #3a3d41;
      --accent: #5b8cff;
      --accent-text: #0b1020;
      --ok: #5fd18a;
      color-scheme: dark
    }

    * {
      box-sizing: border-box
    }

    html {
      height: 100%
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow-x: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: "Comfortaa", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      line-height: 1.4
    }

    main {
      max-width: 760px;
      width: 100%;
      flex: 1;
      display: flex;
      flex-direction: column;
      margin: 0 auto;
      padding: 110px 16px 84px;
      transition: padding 0.4s cubic-bezier(0.4, 0, 0.2, 1)
    }

    #top-header {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: 30;
      transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.4s ease
    }

    .head-container {
      max-width: 760px;
      margin: 0 auto;
      padding: 64px 16px 0;
      position: relative
    }

    h1 {
      font-size: 1.6rem;
      margin: 0 0 6px
    }

    .themebtn {
      position: absolute;
      top: calc(env(safe-area-inset-top, 0px) + 12px);
      left: 12px;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      padding: 0;
      font-size: 1.2rem;
      z-index: 40
    }

    footer {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      gap: 16px;
      padding: 14px 16px;
      border-top: 1px solid var(--line);
      background: var(--card);
      z-index: 10;
      transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.4s ease
    }

    body.playing #top-header {
      transform: translateY(-100%);
      opacity: 0;
      pointer-events: none
    }

    body.playing footer {
      transform: translateY(100%);
      opacity: 0;
      pointer-events: none
    }

    body.playing main {
      padding: calc(env(safe-area-inset-top, 0px) + 20px) 16px calc(env(safe-area-inset-bottom, 0px) + 20px)
    }

    p.lead {
      color: var(--muted);
      margin: 0 0 18px
    }

    .panel {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 18px
    }

    .hidden,
    [hidden] {
      display: none !important
    }

    .fields {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: 12px;
      margin-bottom: 14px
    }

    label {
      display: block;
      font-size: .9rem;
      color: var(--muted)
    }

    label b {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--text);
      margin-bottom: 4px
    }

    input[type=number] {
      width: 100%;
      font-family: inherit;
      font-size: 1.1rem;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--bg);
      color: var(--text)
    }

    button {
      font: inherit;
      cursor: pointer;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--text);
      padding: 9px 14px;
      transition: background-color .25s, opacity .25s, border-color .25s, transform .2s ease
    }

    button.primary {
      background: var(--accent);
      color: var(--accent-text);
      border-color: var(--accent);
      font-weight: 600
    }

    button.primary.rev-mode-btn {
      background: #9d00ff;
      border-color: #9d00ff;
    }

    button:disabled {
      opacity: .45;
      cursor: not-allowed
    }

    button.off {
      opacity: .45;
      cursor: not-allowed;
      transform: none !important
    }

    .err {
      color: #d33;
      min-height: 1.3em;
      margin: 0 0 10px;
      font-size: .95rem
    }

    .status {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px
    }

    #game {
      display: flex;
      flex-direction: column;
      flex: 1
    }

    .game-footer {
      margin-top: auto;
      padding-top: 24px;
      display: flex;
      flex-direction: column;
      align-items: center
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-top: 20px
    }

    .card {
      background: transparent;
      border: none;
      padding: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      font-family: inherit;
      -webkit-appearance: none;
      transition: transform .2s ease;
      outline: none;
      border-radius: 16px;
      height: 100%
    }

    .card:hover:not(.off):not(:disabled) {
      transform: translateY(-6px)
    }

    .card:focus-visible {
      background: rgba(128, 128, 128, 0.1)
    }

    .card.off {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none !important
    }

    .card h2 {
      display: none
    }

    .herd {
      display: flex;
      flex-wrap: wrap;
      gap: 2px;
      height: 290px;
      width: 100%;
      align-content: flex-start;
      transition: opacity 0.3s ease
    }

    .herd svg {
      width: 34px;
      height: 26px;
      filter: drop-shadow(0 0 1px rgba(128, 128, 128, .9))
    }

    .more {
      font-size: .9rem;
      color: var(--muted);
      align-self: center;
      margin-left: 4px
    }

    .hint {
      font-size: .85rem;
      color: var(--muted)
    }

    @keyframes numUpdate {
      0% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.3);
        text-shadow: 0 4px 12px rgba(0, 0, 0, 0.3);
      }

      100% {
        transform: scale(1);
      }
    }

    .num-update {
      animation: numUpdate 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .big-number {
      font-size: 4.5rem;
      font-weight: 800;
      line-height: 1;
      margin-top: auto;
      font-variant-numeric: tabular-nums;
      transition: color .4s ease, transform 0.2s ease;
      text-shadow: 0 1px 2px rgba(0, 0, 0, .15);
      display: inline-block
    }

    .color-name {
      font-size: 1.4rem;
      font-weight: 700;
      margin-top: 4px;
      transition: color .4s ease;
      text-shadow: 0 1px 2px rgba(0, 0, 0, .15)
    }

    .win {
      margin-top: 24px;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid var(--ok);
      color: var(--ok);
      font-weight: 600;
      text-align: center
    }

    .win.rev {
      border-color: #d1124f;
      color: #d1124f
    }

    @media (prefers-color-scheme:dark) {
      :root:not([data-theme="light"]) .win.rev {
        border-color: #ff6b9a;
        color: #ff6b9a
      }
    }

    :root[data-theme="dark"] .win.rev {
      border-color: #ff6b9a;
      color: #ff6b9a
    }

    .actions {
      display: flex;
      gap: 12px;
      margin-top: 16px;
      justify-content: center;
      flex-wrap: wrap
    }

    .rules {
      font-size: .9rem;
      color: var(--muted);
      text-align: center;
      margin: 0
    }

    .slot {
      position: relative
    }

    .slothead {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 6px;
      font-weight: 600
    }

    .dotbtn {
      width: 38px;
      height: 30px;
      border: none;
      background: transparent;
      padding: 0;
      flex: none;
      transition: transform .3s ease;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center
    }

    .dotbtn svg {
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.15))
    }

    .dotbtn:hover {
      transform: scale(1.1)
    }

    .sw {
      width: 34px;
      height: 26px;
      border: none;
      background: transparent;
      padding: 0;
      border-radius: 4px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center
    }

    .sw svg {
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.15))
    }

    .sw.sel {
      outline: 2px solid var(--accent);
      outline-offset: 2px
    }

    .sw.taken {
      cursor: not-allowed;
      opacity: 1;
    }

    .pop {
      position: absolute;
      left: 0;
      top: 42px;
      z-index: 20;
      display: flex;
      gap: 6px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, .25)
    }

    .pop .col {
      display: flex;
      flex-direction: column;
      gap: 6px;
      border: 2px solid transparent;
      border-radius: 18px;
      padding: 2px;
      transition: border-color .2s ease
    }

    .pop .col.taken-group:hover {
      border-color: #d33
    }

    .tip {
      opacity: 0;
      visibility: hidden;
      transform: translateY(4px);
      transition: opacity .22s ease, transform .22s ease, visibility 0s linear .22s
    }

    .tip.show {
      opacity: 1;
      visibility: visible;
      transform: none;
      transition: opacity .22s ease, transform .22s ease, visibility 0s
    }

    #sn0,
    #sn1,
    #sn2 {
      display: inline-block;
      will-change: opacity, transform, filter
    }

    .text-blur-out {
      animation: blurOut .22s cubic-bezier(.4, 0, .2, 1) forwards
    }

    .text-blur-in {
      animation: blurIn .25s cubic-bezier(0, 0, .2, 1) forwards
    }

    @keyframes blurOut {
      from {
        opacity: 1;
        transform: translateY(0);
        filter: blur(0)
      }

      to {
        opacity: 0;
        transform: translateY(-4px);
        filter: blur(4px)
      }
    }

    @keyframes blurIn {
      from {
        opacity: 0;
        transform: translateY(4px);
        filter: blur(4px)
      }

      to {
        opacity: 1;
        transform: translateY(0);
        filter: blur(0)
      }
    }

    .fly-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 100;
      overflow: hidden
    }

    .flying-cham {
      position: fixed;
      width: 34px;
      height: 26px;
      filter: drop-shadow(0 4px 10px rgba(0, 0, 0, .45));
      transition: left .55s cubic-bezier(.25, 1, .5, 1), top .55s cubic-bezier(.25, 1, .5, 1), color .55s ease, transform .55s ease;
      will-change: left, top, color, transform;
    }

    .flying-cham svg {
      width: 100%;
      height: 100%
    }

    .game-bg {
      position: fixed;
      inset: 0;
      z-index: -1;
      opacity: 0.18;
      transition: opacity .5s ease, background .5s ease
    }

    .game-bg.hidden {
      opacity: 0;
      pointer-events: none
    }

    @media (prefers-color-scheme:dark) {
      :root:not([data-theme="light"]) .game-bg {
        opacity: 0.25
      }
    }

    :root[data-theme="dark"] .game-bg {
      opacity: 0.25
    }

    .theming,
    .theming * {
      transition: background-color .4s ease, color .4s ease, border-color .4s ease, box-shadow .4s ease !important
    }

    #revtag .ch {
      display: inline-block;
      white-space: pre;
      opacity: 0;
      transform: translateX(-5px);
      transition: opacity .25s ease, transform .25s ease
    }

    #revtag .ch.on {
      opacity: 1;
      transform: none
    }

    .pop {
      opacity: 0;
      visibility: hidden;
      transform: translateY(-8px) scale(.96);
      transform-origin: top left;
      transition: opacity .2s ease, transform .2s ease, visibility 0s linear .2s
    }

    .pop.open {
      opacity: 1;
      visibility: visible;
      transform: none;
      transition: opacity .2s ease, transform .2s ease, visibility 0s
    }

    .enter {
      animation: secIn .35s ease both
    }

    .leaving {
      animation: secOut .22s ease forwards
    }

    @keyframes secIn {
      from {
        opacity: 0;
        transform: translateY(12px)
      }

      to {
        opacity: 1;
        transform: none
      }
    }

    @keyframes secOut {
      from {
        opacity: 1;
        transform: none
      }

      to {
        opacity: 0;
        transform: translateY(-8px)
      }
    }

    .overlay {
      overflow: hidden
    }

    .overlay.opening {
      animation: ovIn .3s ease both
    }

    .overlay.closing {
      animation: ovOut .35s ease both
    }

    .modal.in {
      animation: mIn .4s cubic-bezier(.2, .8, .2, 1) both
    }

    .modal.out-up {
      animation: outUp .35s ease-in both
    }

    .modal.out-down {
      animation: outDown .35s ease-in both
    }

    .modal.out-left {
      animation: outLeft .35s ease-in both
    }

    .modal.out-right {
      animation: outRight .35s ease-in both
    }

    @keyframes ovIn {
      from {
        background: rgba(0, 0, 0, 0)
      }

      to {
        background: rgba(0, 0, 0, .5)
      }
    }

    @keyframes ovOut {
      from {
        background: rgba(0, 0, 0, .5)
      }

      to {
        background: rgba(0, 0, 0, 0)
      }
    }

    @keyframes mIn {
      from {
        transform: translateY(100vh)
      }

      to {
        transform: none
      }
    }

    @keyframes outUp {
      to {
        transform: translateY(-100vh)
      }
    }

    @keyframes outDown {
      to {
        transform: translateY(100vh)
      }
    }

    @keyframes outLeft {
      to {
        transform: translateX(-100vw)
      }
    }

    @keyframes outRight {
      to {
        transform: translateX(100vw)
      }
    }

    @media (prefers-reduced-motion:reduce) {
      * {
        animation-duration: .01ms !important;
        transition-duration: .01ms !important
      }
    }

    .tip {
      position: fixed;
      z-index: 60;
      max-width: 240px;
      background: #222;
      color: #fff;
      font-size: .85rem;
      padding: 6px 10px;
      border-radius: 8px;
      pointer-events: none;
      box-shadow: 0 4px 14px rgba(0, 0, 0, .35)
    }

    /* Анимация CSS Grid для плавного расширения блока */
    .startbox {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 10px;
    }

    .rev-warning-wrap {
      display: grid;
      grid-template-rows: 0fr;
      transition: grid-template-rows 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
      width: 100%;
      text-align: center;
    }

    .rev-warning-wrap.show {
      grid-template-rows: 1fr;
    }

    .rev-warning {
      overflow: hidden;
      color: #d1124f;
      font-weight: 600;
      font-size: 0.95rem;
      opacity: 0;
      transition: opacity 0.25s ease;
    }

    .rev-warning-wrap.show .rev-warning {
      opacity: 1;
      transition: opacity 0.4s ease 0.1s;
    }

    .rev-warning-text {
      padding-top: 12px;
      /* Создаёт отступ от кнопки без резких скачков gap */
    }

    @media (prefers-color-scheme:dark) {
      :root:not([data-theme="light"]) .rev-warning {
        color: #ff6b9a
      }
    }

    :root[data-theme="dark"] .rev-warning {
      color: #ff6b9a
    }

    .revbox {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer
    }

    .revbox input {
      -webkit-appearance: none;
      appearance: none;
      width: 22px;
      height: 22px;
      margin: 0;
      flex: none;
      border: 2px solid var(--line);
      border-radius: 6px;
      background: var(--bg);
      display: grid;
      place-content: center;
      cursor: pointer
    }

    .revbox input:checked {
      background: var(--accent);
      border-color: var(--accent)
    }

    .revbox input:checked::after {
      content: "";
      width: 6px;
      height: 11px;
      border: solid var(--accent-text);
      border-width: 0 3px 3px 0;
      transform: rotate(45deg) translate(-1px, -1px)
    }

    .revbox input:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px
    }

    input[type=number] {
      -moz-appearance: textfield;
      appearance: textfield
    }

    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0
    }

    .num {
      display: flex;
      gap: 6px;
      align-items: stretch
    }

    .num input {
      flex: 1;
      width: auto;
      min-width: 0;
      text-align: center
    }

    .step {
      width: 40px;
      flex: none;
      padding: 0;
      font-size: 1.3rem;
      line-height: 1
    }

    .fbtn {
      width: 48px;
      height: 48px;
      padding: 0;
      background: transparent;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform .2s ease;
      border-radius: 0;
    }

    .fbtn:hover {
      transform: scale(1.1)
    }

    .fbtn img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block
    }

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .5);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 50
    }

    .modal {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 14px;
      max-width: 520px;
      width: 100%;
      max-height: 85vh;
      overflow: auto;
      padding: 20px;
      display: flex;
      flex-direction: column
    }

    .modal h2 {
      margin: 0 0 10px;
      font-size: 1.2rem
    }

    .modal p {
      margin: 0 0 10px
    }

    .modal a {
      color: var(--accent)
    }

    .modal-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 18px;
    }
  </style>
</head>

<body>
  <div id="game-bg" class="game-bg hidden"></div>

  <header id="top-header">
    <button id="themebtn" class="themebtn" type="button" aria-label="Сменить тему"></button>
    <div class="head-container">
      <h1>Хамелеоны<span id="revtag"></span></h1>
    </div>
  </header>

  <main>
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
      <symbol id="cham" viewBox="0 0 44 30">
        <path d="M 13 16 C 4 19, 1 10, 5 5 C 9 1, 14 5, 12 9 C 11 11.5, 8.5 10.5, 9 9" fill="none" stroke="currentColor"
          stroke-width="3.5" stroke-linecap="round" />
        <path d="M 17 18 L 15 25 M 29 18 L 31 25" fill="none" stroke="currentColor" stroke-width="3.5"
          stroke-linecap="round" />
        <path d="M 11 15 C 11 7, 24 6, 30 8 C 33 4, 39 5, 40 10.5 C 41 15, 37 18, 32 18 C 24 19.5, 13 19, 11 15 Z"
          fill="currentColor" />
        <circle cx="34.5" cy="11" r="3.2" fill="#fff" />
        <circle cx="35" cy="11" r="1.4" fill="#111" />
      </symbol>
    </svg>

    <section id="setup" class="panel">
      <div class="fields">
        <div class="slot">
          <div class="slothead"><button type="button" class="dotbtn" id="dot0" aria-label="Выбрать цвет"
              title="Выбрать цвет"></button><span id="sn0"></span></div><label><input type="number" id="n0" min="0"
              step="1" value="13"></label>
          <div class="pop" id="pal0"></div>
        </div>
        <div class="slot">
          <div class="slothead"><button type="button" class="dotbtn" id="dot1" aria-label="Выбрать цвет"
              title="Выбрать цвет"></button><span id="sn1"></span></div><label><input type="number" id="n1" min="0"
              step="1" value="15"></label>
          <div class="pop" id="pal1"></div>
        </div>
        <div class="slot">

      function buildFooter(items, openOnStartIdx) {

      var fallbackConfig = [
        { "title": "Об игре", "image": "assets/about.png", "html": "<p>«Хамелеоны» — небольшая логическая мини-игра по мотивам классической головоломки о хамелеонах, меняющих цвет.</p><p>Игра работает прямо в браузере, ничего устанавливать не нужно.</p>", "revers_button": true },
        { "title": "Правила", "image": "assets/rules.png", "html": "<p>В начале введите количество хамелеонов каждого из трёх цветов. Выберите цвета из палитры.</p><p><b>Обычная игра.</b> Выбираете цвет: его становится на 2 больше, двух других — на 1 меньше.</p><p><b>Игра «наоборот».</b> Выбранный цвет уменьшается на 2, остальные увеличиваются на 1.</p>", "revers_button": false },
        { "title": "Создатель", "image": "assets/personal.png", "html": "<p><a href=\"#\" target=\"_blank\">Перейти на сайт создателя</a></p>", "revers_button": false }

      var modalClosing = false;
      function closeModal(dir) {
        var ov = $("ov"), mod = ov.querySelector(".modal");

        }, 350);
      }
      function fallback(img) {

      function renderSetup() {
        for (var i = 0; i < 3; i++) {
          (function (i) {
            var p = PALETTE[slot[i]];

                  });

                } else {

      }

      [0, 1, 2].forEach(function (i) {
        var inp = $("n" + i), wrap = document.createElement("div");

        function mk(txt, label, d) {
          var b = document.createElement("button");
          b.type = "button"; b.className = "step"; b.textContent = txt; b.setAttribute("aria-label", label);
          b.addEventListener("click", function () {
            var v = parseInt(inp.value, 10); if (isNaN(v)) v = 0;
            inp.value = Math.max(0, v + d);
            $("err").textContent = "";
          });
          return b;
        }
        wrap.appendChild(mk("−", "Меньше", -1));
        wrap.appendChild(inp);
        wrap.appendChild(mk("+", "Больше", 1));
      });

      var themeBtn = $("themebtn");
      function currentTheme() {
        var t = document.documentElement.getAttribute("data-theme");
        if (t) return t;
        return (window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
      }
      var themeT = null;
      function applyTheme(t, save) {
        if (save) {
          var de = document.documentElement; de.classList.add("theming");
          clearTimeout(themeT); themeT = setTimeout(function () { de.classList.remove("theming"); }, 500);
        }
        document.documentElement.setAttribute("data-theme", t);
        themeBtn.textContent = t === "dark" ? "☀️" : "🌙";
        themeBtn.title = t === "dark" ? "Включить светлую тему" : "Включить тёмную тему";
        if (save) { try { localStorage.setItem("cham-theme", t); } catch (e) { } }
      }
      var savedTheme = null;
      try { savedTheme = localStorage.getItem("cham-theme"); } catch (e) { }
      if (savedTheme === "light" || savedTheme === "dark") applyTheme(savedTheme, false); else applyTheme(currentTheme(), false);
      themeBtn.addEventListener("click", function () { applyTheme(currentTheme() === "dark" ? "light" : "dark", true); });

      var tipTimer = null;
      function showTip(el, text) {
        var t = $("tip");
        t.textContent = text || "Этот оттенок уже занят, кликните дважды чтобы поменять местами";
        var r = el.getBoundingClientRect(), w = t.offsetWidth, h = t.offsetHeight;
        var left = Math.max(8, Math.min(window.innerWidth - w - 8, r.left + r.width / 2 - w / 2));
        var top = r.top - h - 8; if (top < 8) top = r.bottom + 8;
        t.style.left = left + "px"; t.style.top = top + "px";
        t.classList.add("show");
      }
      function hideTip() { $("tip").classList.remove("show"); }
      function closePops() {
        hideTip();
        for (var i = 0; i < 3; i++) $("pal" + i).classList.remove("open");
      }
      [0, 1, 2].forEach(function (i) {
        $("dot" + i).addEventListener("click", function () {
          var p = $("pal" + i), wasClosed = !p.classList.contains("open");
          closePops();
          if (wasClosed) p.classList.add("open");
        });
      });
      document.addEventListener("click", function (e) {
        if (!e.target.closest(".slot")) closePops();
      });
      document.addEventListener("keydown", function (e) { if (e.key === "Escape") closePops(); });
      renderSetup();

      function attachNoMovesTip(btnId) {
        var btn = $(btnId);
        btn.addEventListener("mouseenter", function () {
          if (history.length === 0 && !isAnimating) showTip(btn, "Ещё не сделано ни одного хода");
        });
        btn.addEventListener("mouseleave", hideTip);
        btn.addEventListener("focus", function () {
          if (history.length === 0 && !isAnimating) showTip(btn, "Ещё не сделано ни одного хода");
        });
        btn.addEventListener("blur", hideTip);
      }
      attachNoMovesTip("undo");
      attachNoMovesTip("restart-same");

      var revChars = [];
      (function () {
        var tag = $("revtag"), txt = " (наоборот)";
        for (var k = 0; k < txt.length; k++) {
          var s = document.createElement("span"); s.className = "ch"; s.textContent = txt.charAt(k);
          tag.appendChild(s); revChars.push(s);
        }
      })();
      var revTimers = [];
      function setRevTag(on) {
        var n = revChars.length;
        revTimers.forEach(clearTimeout); revTimers = [];
        revChars.forEach(function (s, i) {
          var d = (on ? i : n - 1 - i) * 50;
          revTimers.push(setTimeout(function () { s.classList.toggle("on", on); }, d));
        });
      }

      $("modal-rev").addEventListener("change", function () {
        $("rev-warn-wrap").classList.toggle("show", this.checked);
        $("start").classList.toggle("rev-mode-btn", this.checked);
        setRevTag(this.checked);
      });

      $("start").addEventListener("click", start);
      ["n0", "n1", "n2"].forEach(function (id) {
        $(id).addEventListener("keydown", function (e) { if (e.key === "Enter") start(); });
      });

      $("undo").addEventListener("click", function () {
        if (history.length === 0 || isAnimating) {
          if (history.length === 0 && !isAnimating) {
            showTip(this, "Ещё не сделано ни одного хода");
            clearTimeout(tipTimer); tipTimer = setTimeout(hideTip, 2500);
          }
          return;
        }
        undo();
      });

      $("restart-same").addEventListener("click", function () {
        if (history.length === 0 || isAnimating) {
          if (history.length === 0 && !isAnimating) {
            showTip(this, "Ещё не сделано ни одного хода");
            clearTimeout(tipTimer); tipTimer = setTimeout(hideTip, 2500);
          }
          return;
        }
        isAnimating = true;
        hideTip();

        for (var i = 0; i < 3; i++) {
          var herd = $("c-herd-" + i);
          if (herd) herd.style.opacity = "0";
        }

        setTimeout(function () {
          counts = initialCounts.slice();
          history = [];
          moves = 0;
          finished = false;
          render();

          for (var i = 0; i < 3; i++) {
            var herd = $("c-herd-" + i);
            if (herd) herd.style.opacity = "1";
          }

          setTimeout(function () {
            isAnimating = false;
            render();
          }, 300);
        }, 300);
      });

      $("finish").addEventListener("click", function () { finished = true; render(); });

      $("restart").addEventListener("click", function () {
        document.body.classList.remove("playing");
        $("limitnote").classList.add("hidden");
        $("game-bg").classList.add("hidden");
        hideSection($("game"), function () {
          showSection($("setup"));
        });
      });
    })();
  </script>
</body>

</html>
